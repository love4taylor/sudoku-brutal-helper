[package]
name = "sudoku-brutal-helper"
version = "0.1.0"
edition = "2024"
description = "Apply TCP Brutal rules to clients connected to a Sudoku server"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
